<div>
  <div class="form-tabs">
    <button type="button" class="tab-btn" [class.active]="mode()==='copy'" (click)="mode.set('copy')">Copy DataCollection Value</button>
    <button type="button" class="tab-btn" [class.active]="mode()==='lookup'" (click)="mode.set('lookup')">Record Lookup</button>
    <button type="button" class="tab-btn" [class.active]="mode()==='results'" (click)="mode.set('results')">Tool Results</button>
  </div>

  <ng-container *ngIf="mode() === 'results'; else elseIfBlock1">
    <app-record-copy-results />
  </ng-container>
  <ng-template #elseIfBlock1>
    <ng-container *ngIf="mode() === 'lookup'; else elseBlock1">
      <div class="form-grid">
        <div class="form-group"><label>Case ID</label>
          <input required [ngModel]="lookup().caseId" (ngModelChange)="setLookupField('caseId',$event)" placeholder="case123" /></div>
        <div class="form-group"><label>Program</label>
          <select [ngModel]="lookup().program" (ngModelChange)="setLookupField('program',$event)">
            <ng-container *ngFor="let p of programs; trackBy: trackByProgram"> <option [value]="p">{{ p }}</option> </ng-container>
          </select></div>
        <div class="form-group"><label>Config {{ lookupMappingLoading() ? '(loading...)' : '' }}</label>
          <select required [ngModel]="lookup().configId" (ngModelChange)="setLookupField('configId',$event)" [disabled]="lookupMappingLoading()">
            <option value="">Select config...</option>
            <ng-container *ngFor="let c of lookupMapping(); trackBy: trackByConfigId"> <option [value]="c.config.configId">{{ c.config.configLabel }}</option> </ng-container>
          </select></div>
        <div class="form-group"><label>Section</label>
          <select required [ngModel]="lookup().sectionId" (ngModelChange)="setLookupField('sectionId',$event)" [disabled]="!lookup().configId">
            <option value="">Select section...</option>
            <ng-container *ngFor="let s of lookupSections; trackBy: trackBySectionId"> <option [value]="s.section.sectionId">{{ s.section.sectionLabel }}</option> </ng-container>
          </select></div>
        <div class="form-group"><label>Element</label>
          <select required [ngModel]="lookup().elementId" (ngModelChange)="setLookupField('elementId',$event)" [disabled]="!lookup().sectionId">
            <option value="">Select element...</option>
            <ng-container *ngFor="let el of lookupElements; trackBy: trackByElementId"> <option [value]="el.elementId">{{ el.elementLabel }}</option> </ng-container>
          </select></div>
        <ng-container *ngIf="lookupError()">
          <p class="error-msg">{{ lookupError() }}</p>
        </ng-container>
        <button type="button" class="submit-btn" [disabled]="loading()" (click)="handleLookup()">
          {{ loading() ? 'Fetching...' : 'Fetch Record Data' }}
        </button>
      </div>
      <ng-container *ngIf="lookupResult()">
        <div class="lookup-result">
          <ng-container *ngFor="let row of lookupResult()!; trackBy: trackByIndex">
            <div class="lookup-kv">
              <ng-container *ngFor="let entry of lookupEntries(row); trackBy: trackByEntryKey">
                <div class="lookup-kv-row">
                  <span class="lookup-kv-key">{{ entry.key }}</span>
                  <span class="lookup-kv-val">{{ entry.val }}</span>
                </div>
              </ng-container>
            </div>
          </ng-container>
        </div>
      </ng-container>
    </ng-container>
    <ng-template #elseBlock1>
      <div class="form-grid">
        <div class="form-group"><label>Program</label>
          <select [ngModel]="form().program" (ngModelChange)="setFormField('program',$event)">
            <ng-container *ngFor="let p of programs; trackBy: trackByProgram"> <option [value]="p">{{ p }}</option> </ng-container>
          </select></div>
        <div class="form-group"><label>Task</label>
          <select [ngModel]="form().task" (ngModelChange)="setFormField('task',$event)">
            <ng-container *ngFor="let t of tasks; trackBy: trackByTask"> <option [value]="t">{{ t }}</option> </ng-container>
          </select></div>
        <div class="form-group"><label>Config {{ mappingLoading() ? '(loading...)' : '' }}</label>
          <select required [ngModel]="form().configId" (ngModelChange)="setFormField('configId',$event)" [disabled]="mappingLoading()">
            <option value="">Select config...</option>
            <ng-container *ngFor="let c of mapping(); trackBy: trackByConfigId"> <option [value]="c.config.configId">{{ c.config.configLabel }}</option> </ng-container>
          </select></div>
        <ng-container *ngIf="needsSection">
          <div class="form-group"><label>Section</label>
            <select required [ngModel]="form().sectionId" (ngModelChange)="setFormField('sectionId',$event)" [disabled]="!form().configId">
              <option value="">Select section...</option>
              <ng-container *ngFor="let s of formSections; trackBy: trackBySectionId"> <option [value]="s.section.sectionId">{{ s.section.sectionLabel }}</option> </ng-container>
            </select></div>
        </ng-container>
        <ng-container *ngIf="needsElement">
          <div class="form-group"><label>Element</label>
            <select required [ngModel]="form().elementId" (ngModelChange)="setFormField('elementId',$event)" [disabled]="!form().sectionId">
              <option value="">Select element...</option>
              <ng-container *ngFor="let el of formElements; trackBy: trackByElementId"> <option [value]="el.elementId">{{ el.elementLabel }}</option> </ng-container>
            </select></div>
        </ng-container>
        <div class="form-group"><label>Effective Date <small>optional</small></label>
          <input type="date" [ngModel]="form().effectiveDate" (ngModelChange)="setFormField('effectiveDate',$event)" /></div>
        <div class="form-group full-width"><label>Case IDs <small>one per line or comma separated</small></label>
          <textarea required rows="4" [ngModel]="form().caseIdsRaw" (ngModelChange)="setFormField('caseIdsRaw',$event)" placeholder="case123&#10;case456"></textarea></div>
        <ng-container *ngIf="error()">
          <p class="error-msg">{{ error() }}</p>
        </ng-container>
        <button type="button" class="submit-btn" [disabled]="loading()" (click)="handleSubmit()">
          {{ loading() ? 'Submitting...' : 'Copy to Record' }}
        </button>
      </div>
    </ng-template>
  </ng-template>
</div>
