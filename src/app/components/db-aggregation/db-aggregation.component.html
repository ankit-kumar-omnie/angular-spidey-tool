<div class="db-root">

  <!-- ── Connection ── -->
  <div class="db-builder">
    <span class="db-section-title">Mongo Aggregation</span>

    <div class="db-form-grid">
      <div class="db-field">
        <label>Local DB Server URL</label>
        <input type="text" class="db-input db-input--mono"
          [ngModel]="serverUrl()" (ngModelChange)="serverUrl.set($event)"
          placeholder="http://localhost:3333" />
      </div>
      <div class="db-field">
        <label>Database</label>
        <input type="text" class="db-input"
          [ngModel]="database()" (ngModelChange)="database.set($event)"
          placeholder="e.g. informed" />
      </div>
      <div class="db-field">
        <label>Collection</label>
        <input type="text" class="db-input"
          [ngModel]="collection()" (ngModelChange)="collection.set($event)"
          placeholder="e.g. Case (Mongo collection names are case-sensitive)" />
      </div>
    </div>

    <div class="db-field">
      <label>Mongo URL <span class="db-field-hint">connection string, kept in this session only</span></label>
      <input type="password" class="db-input db-input--mono"
        [ngModel]="mongoUrl()" (ngModelChange)="mongoUrl.set($event)"
        placeholder="mongodb://localhost:27017" />
    </div>

    <div class="db-field">
      <label>Aggregation Pipeline</label>
      <textarea class="db-input db-input--mono db-pipeline" rows="14"
        [ngModel]="pipelineText()" (ngModelChange)="pipelineText.set($event)"
        placeholder="[ { $match: { id: { $in: [] } } } ]"></textarea>
    </div>
  </div>

  <!-- ── Actions ── -->
  <div class="db-actions">
    <button type="button" class="db-secondary-btn" (click)="loadCaseDefault()">
      Load Case Default
    </button>
    <button type="button" class="db-secondary-btn" [disabled]="!caseContext.ids().length" (click)="insertCaseIds()">
      Insert Case IDs from Event Store
      <span class="db-badge" *ngIf="caseContext.ids().length">{{ caseContext.ids().length }}</span>
    </button>

    <button type="button" class="db-run-btn" [disabled]="loading() || !hasValidInput()" (click)="run()">
      <ng-container *ngIf="loading(); else runIcon">
        <span class="db-spinner"></span>
        Running…
      </ng-container>
      <ng-template #runIcon>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Run Aggregation
      </ng-template>
    </button>
  </div>

  <p class="db-error" *ngIf="error()">{{ error() }}</p>

  <!-- ── Results ── -->
  <ng-container *ngIf="results().length; else noResultsBlock">
    <div class="db-results-actions">
      <span class="db-count-badge">{{ results().length }} document{{ results().length !== 1 ? 's' : '' }}</span>
      <button type="button" class="db-export-btn" (click)="exportJson()">Export JSON</button>
      <button type="button" class="db-export-btn" (click)="exportExcel()">Export to Excel</button>
    </div>

    <div class="db-column-picker">
      <div class="db-column-picker-header">
        <span class="db-column-picker-label">Columns ({{ selectedColumnsOrdered().length }} / {{ allColumns().length }})</span>
        <button type="button" class="db-column-picker-action" (click)="selectAllColumns()">Select All</button>
        <button type="button" class="db-column-picker-action" (click)="clearAllColumns()">Clear</button>
      </div>
      <div class="db-column-picker-list">
        <button type="button" *ngFor="let col of allColumns(); trackBy: trackByColumn"
          class="db-column-chip" [class.active]="selectedColumns().has(col)" (click)="toggleColumn(col)">
          <svg *ngIf="selectedColumns().has(col)" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          {{ col }}
        </button>
      </div>
    </div>

    <ng-container *ngIf="selectedColumnsOrdered().length; else noColumnsBlock">
      <div class="db-table-wrap">
        <table class="db-table">
          <thead>
            <tr>
              <th *ngFor="let col of selectedColumnsOrdered(); trackBy: trackByColumn">{{ col }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of tableRows(); trackBy: trackById">
              <td *ngFor="let col of selectedColumnsOrdered(); trackBy: trackByColumn">{{ row.flat[col] }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>
    <ng-template #noColumnsBlock>
      <p class="db-empty">No columns selected — check at least one above.</p>
    </ng-template>
  </ng-container>
  <ng-template #noResultsBlock>
    <p class="db-empty" *ngIf="searched() && !error()">No documents matched this aggregation.</p>
  </ng-template>

</div>
