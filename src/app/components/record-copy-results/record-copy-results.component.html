<div>
  <form class="rc-results-filters" (ngSubmit)="handleSearch()">
    <div class="filter-group"><label>ID</label>
      <input [ngModel]="filters().id ?? ''" (ngModelChange)="setFilter('id',$event)" name="id" placeholder="Aggregate ID" /></div>
    <div class="filter-group"><label>Config ID</label>
      <input [ngModel]="filters().configId ?? ''" (ngModelChange)="setFilter('configId',$event)" name="configId" placeholder="Config ID" /></div>
    <div class="filter-group"><label>Section ID</label>
      <input [ngModel]="filters().sectionId ?? ''" (ngModelChange)="setFilter('sectionId',$event)" name="sectionId" placeholder="Section ID" /></div>
    <div class="filter-group"><label>Element ID</label>
      <input [ngModel]="filters().elementId ?? ''" (ngModelChange)="setFilter('elementId',$event)" name="elementId" placeholder="Element ID" /></div>
    <div class="filter-group"><label>Program</label>
      <select [ngModel]="filters().program ?? ''" (ngModelChange)="setFilter('program',$event)" name="program">
        <option value="">All</option>
        <ng-container *ngFor="let p of programs; trackBy: trackByProgram"> <option [value]="p">{{ p }}</option> </ng-container>
      </select></div>
    <div class="filter-group"><label>Task</label>
      <select [ngModel]="filters().task ?? ''" (ngModelChange)="setFilter('task',$event)" name="task">
        <option value="">All</option>
        <ng-container *ngFor="let t of tasks; trackBy: trackByTask"> <option [value]="t">{{ t }}</option> </ng-container>
      </select></div>
    <div class="filter-group"><label>Status</label>
      <select [ngModel]="filters().status ?? ''" (ngModelChange)="setFilter('status',$event)" name="status">
        <option value="">All</option>
        <ng-container *ngFor="let s of statuses; trackBy: trackByStatus"> <option [value]="s">{{ s }}</option> </ng-container>
      </select></div>
    <button type="submit" class="search-btn" [disabled]="loading()">{{ loading() ? 'Searching...' : 'Search' }}</button>
  </form>

  <ng-container *ngIf="error()">
    <p class="results-error">{{ error() }}</p>
  </ng-container>
  <ng-container *ngIf="results() !== null && results()!.length === 0">
    <p class="results-empty">No results found.</p>
  </ng-container>
  <ng-container *ngIf="results() !== null && results()!.length > 0">
    <div class="result-cards">
      <ng-container *ngFor="let r of results()!; trackBy: trackById">
        <app-copy-result-card [record]="r" (refresh)="handleRefresh($event)" />
      </ng-container>
    </div>
  </ng-container>
</div>
